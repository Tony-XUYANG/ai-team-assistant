<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#166c55">
  <title>协作台 · 项目工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/lucide.min.js" defer></script>
  <script src="/brief-format.js" defer></script>
  <script src="/workspace.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到工作区</a>
  <div id="sidebar-backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="项目导航">
    <div class="brand"><span class="brand-mark"><i data-lucide="panels-top-left"></i></span><div><strong>协作台</strong><span>AI 团队助手 · 本地版</span></div><button class="icon-button mobile-only" id="close-nav" aria-label="关闭项目导航" title="关闭项目导航"><i data-lucide="x"></i></button></div>
    <div class="sidebar-heading"><h2>我的项目</h2><button class="icon-button" id="new-project" aria-label="新建项目" title="新建项目"><i data-lucide="plus"></i></button></div>
    <label class="search"><i data-lucide="search"></i><input id="project-search" type="search" aria-label="搜索已加载项目" placeholder="搜索已加载项目" maxlength="120"></label>
    <div id="projects-error" class="inline-error" role="alert" hidden></div>
    <nav id="project-list" aria-label="项目列表"><p class="subtle">正在加载项目…</p></nav>
    <button class="text-button" id="more-projects" hidden>加载更多项目</button>
    <div class="sidebar-footer"><span><i data-lucide="monitor"></i>个人工作空间</span><span class="subtle">AI 未接入</span></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb"><button class="icon-button mobile-only" id="open-nav" aria-label="打开项目导航" title="打开项目导航" aria-expanded="false"><i data-lucide="menu"></i></button><span>工作台</span><i data-lucide="chevron-right"></i><span id="breadcrumb-name">我的项目</span></div><div class="topbar-right"><span class="local-state"><span class="status-dot"></span>本地空间</span><button class="icon-button" id="refresh" aria-label="刷新数据" title="刷新数据"><i data-lucide="refresh-cw"></i></button></div></header>
    <div class="security-note"><i data-lucide="shield-alert"></i><span>本地试用 · 未启用登录与团队权限，请勿录入敏感信息。</span></div>
    <main id="main" tabindex="-1">
      <div id="page-error" class="error-banner" role="alert" hidden></div>
      <div id="loading" class="empty-state" hidden><i data-lucide="loader-circle"></i><p>正在读取项目…</p></div>
      <section id="welcome" class="empty-state" hidden><i data-lucide="folder-plus"></i><h1>从一个项目开始</h1><p>还没有项目</p><button class="primary" id="welcome-create"><i data-lucide="plus"></i>新建项目</button></section>
      <div id="project-view" hidden>
        <section class="project-heading"><div><div class="eyebrow">项目工作台 <span id="project-status" class="badge"></span></div><h1 id="project-name"></h1><p id="project-objective"></p></div><button class="primary" id="new-entry"><i data-lucide="plus"></i>添加记录</button></section>
        <div class="view-bar"><div class="tabs" role="tablist" aria-label="项目视图"><button role="tab" id="tab-brief" aria-controls="panel-brief" aria-selected="true" tabindex="0" data-tab="brief">交接简报</button><button role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" tabindex="-1" data-tab="history">记录历史</button><button role="tab" id="tab-info" aria-controls="panel-info" aria-selected="false" tabindex="-1" data-tab="info">项目资料</button></div><span class="updated" id="snapshot-time"></span></div>
        <section id="panel-brief" role="tabpanel" aria-labelledby="tab-brief">
          <div class="brief-meta"><span><i data-lucide="files"></i>基于已记录信息</span><span>确认状态由记录者声明</span><div class="brief-tools"><button class="icon-button" id="copy-brief" aria-label="复制交接简报（Markdown）" title="复制交接简报（Markdown）"><i data-lucide="copy"></i></button><button class="icon-button" id="export-brief" aria-label="下载交接简报" title="下载交接简报（JSON）"><i data-lucide="download"></i></button></div></div>
          <div class="stats" id="stats"></div>
          <div class="brief-grid" id="brief-sections"></div>
        </section>
        <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden><div class="section-heading"><h2>记录历史</h2><span id="history-count" class="subtle"></span></div><div id="history-error" class="inline-error" role="alert" hidden></div><div id="history-list"></div><button class="secondary load-more" id="more-history" hidden>加载更早记录</button></section>
        <section id="panel-info" role="tabpanel" aria-labelledby="tab-info" hidden><div id="project-info"></div></section>
      </div>
    </main>
    <footer class="page-footer"><span>协作台</span><span>项目上下文 · 本地预览</span></footer>
  </div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <header class="dialog-header"><div><p class="eyebrow" id="editor-context"></p><h2 id="editor-title">新建项目</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="关闭表单" title="关闭表单"><i data-lucide="x"></i></button></header>
      <div class="form-fields">
        <div id="project-fields"><label>项目名称<input name="name" maxlength="120" autocomplete="off"></label><label>项目目标<textarea name="objective" rows="3" maxlength="2000"></textarea></label><label>项目约束（每行一条，可选）<textarea name="constraints" rows="3"></textarea></label></div>
        <div id="entry-fields" hidden><div class="form-row"><label>记录类型<select name="kind"><option value="progress">进展</option><option value="action">待办</option><option value="blocker">阻塞</option><option value="decision">决策</option></select></label><label>处理状态<select name="status"></select></label></div><label>记录内容<textarea name="content" rows="4" maxlength="4000"></textarea></label><div class="form-row"><label>确认状态<select name="verification"><option value="unverified">待确认</option><option value="confirmed">已确认（记录者声明）</option><option value="disputed">有争议</option></select></label><label>负责人（可选）<input name="owner_ref" maxlength="120" autocomplete="off"></label></div><label>发生时间（可选）<input type="datetime-local" name="occurred_at" step="1"></label></div>
        <fieldset><legend>信息来源</legend><div class="form-row"><label>来源类型<select name="source_kind"><option value="note">工作记录</option><option value="url">网页</option><option value="document">文档</option><option value="message">消息</option><option value="other">其他</option></select></label><label>来源名称<input name="source_label" required maxlength="160" autocomplete="off"></label></div><label>来源地址或位置（可选）<input name="source_locator" maxlength="2000" autocomplete="off"></label></fieldset>
        <p id="form-error" class="inline-error" role="alert" hidden></p>
      </div>
      <footer class="dialog-footer"><button type="button" class="secondary" id="cancel-editor">取消</button><button class="primary" type="submit" id="save-editor"><i data-lucide="check"></i><span>保存</span></button></footer>
    </form>
  </dialog>
  <dialog id="copy-preview" aria-labelledby="copy-preview-title" aria-describedby="copy-preview-error">
    <header class="dialog-header"><div><p class="eyebrow" id="copy-project-name"></p><h2 id="copy-preview-title">交接简报</h2></div><button type="button" class="icon-button" id="close-copy-preview" aria-label="关闭简报" title="关闭简报"><i data-lucide="x"></i></button></header>
    <div class="copy-preview-body"><p class="inline-error" id="copy-preview-error" role="alert">剪贴板不可用，简报尚未复制。可手动复制以下文本，或下载 Markdown。</p><label for="copy-text">Markdown 简报</label><textarea id="copy-text" readonly spellcheck="false" rows="12"></textarea></div>
    <footer class="dialog-footer"><button type="button" class="secondary" id="select-copy-text"><i data-lucide="text-select"></i>全选</button><button type="button" class="primary" id="download-markdown"><i data-lucide="download"></i>下载 Markdown</button></footer>
  </dialog>
  <div id="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript 以访问项目工作台。</noscript>
</body>
</html>
