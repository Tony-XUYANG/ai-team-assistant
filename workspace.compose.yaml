name: team-assistant-workspace

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_DB: workspace
      POSTGRES_PASSWORD: ${WORKSPACE_PASSWORD:?Run npm run workspace:start}
    volumes:
      - workspace-data:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    image: shortener:workspace-3.5.0
    environment: &database
      PGHOST: db
      PGUSER: workspace
      PGDATABASE: workspace
      PGPASSWORD: ${WORKSPACE_PASSWORD:?Run npm run workspace:start}
    command: ["node", "migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
  api:
    build: .
    image: shortener:workspace-3.5.0
    environment: *database
    ports:
      - "127.0.0.1:${WORKSPACE_PORT:-8082}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  workspace-data:
